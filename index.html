<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOC Interactive Quiz — London Metropolitan University</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffe6f0;
            --surface: #fff0f6;
            --card: #ffcceb;
            --accent: #ff1493;
            --accent2: #ff69b4;
            --correct: #ff1493;
            --wrong: #ff6b9d;
            --neutral: #ff85c1;
            --text: #6b1448;
            --muted: #b8449d;
            --border: #ff99d1;
            --badge-w1: #ff6b9d;
            --badge-w2: #ff1493;
            --badge-w3: #ff69b4;
            --badge-w4: #ff85c1;
            --badge-w5: #ff99d1;
            --badge-w6: #ec4899;
            --badge-mx: #ff1493;
        }

        body {
            font-family: 'Arial', 'Trebuchet MS', system-ui, sans-serif;
            background: #111111;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        #emoji-sky {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .flying-emoji {
            position: absolute;
            top: 0;
            left: 0;
            transform: translate3d(var(--start-x), var(--y), 0) scale(var(--scale));
            opacity: 0;
            will-change: transform, opacity, filter;
            animation: flyAcross var(--duration) linear forwards;
            filter: drop-shadow(0 0 8px rgba(255, 20, 147, 0.28));
        }

        .flying-emoji__inner {
            display: inline-block;
            font-size: var(--size);
            line-height: 1;
            animation: bob 2.8s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes flyAcross {
            0% {
                transform: translate3d(var(--start-x), var(--y), 0) scale(calc(var(--scale) * 0.92));
                opacity: 0;
            }

            10% {
                opacity: var(--alpha);
            }

            65% {
                opacity: var(--alpha);
            }

            100% {
                transform: translate3d(var(--end-x), calc(var(--y) + var(--drift)), 0) scale(calc(var(--scale) * 1.08));
                opacity: 0;
            }
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(-6px) rotate(-5deg);
            }

            50% {
                transform: translateY(6px) rotate(5deg);
            }
        }

        header,
        .container {
            position: relative;
            z-index: 1;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 20, 147, 0.3), 0 0 20px rgba(255, 105, 180, 0.2);
            }

            50% {
                box-shadow: 0 0 20px rgba(255, 20, 147, 0.6), 0 0 40px rgba(255, 105, 180, 0.4);
            }
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, #ffcceb 0%, #ff99d1 100%);
            border-bottom: 2px solid #ff85c1;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            animation: glow 2s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(255, 20, 147, 0.2);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
        }

        header h1 span {
            color: #ff1493;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
            animation: sparkle 2s ease-in-out infinite;
        }

        #score-badge {
            background: rgba(255, 204, 235, 0.8);
            border: 2px solid #ff1493;
            border-radius: 999px;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            color: var(--text);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            animation: glow 2s ease-in-out infinite;
        }

        #score-badge b {
            color: #ff1493;
            font-weight: 800;
        }

        .container {
            width: 100%;
            max-width: 820px;
            padding: 2rem 1.5rem 4rem;
            flex: 1;
        }

        /* ── Progress bar ─────────────────────────────── */
        #progress-wrap {
            margin-bottom: 1.8rem;
        }

        #progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        #progress-bar-track {
            height: 6px;
            background: #ffe6f0;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid #ff99d1;
        }

        #progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff1493, #ff69b4, #ff1493);
            border-radius: 999px;
            transition: width 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
            animation: glow 1.5s ease-in-out infinite;
        }

        /* ── Filter pills ─────────────────────────────── */
        #filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-pill {
            padding: 0.3rem 0.85rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid #ff99d1;
            transition: all 0.15s;
            user-select: none;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe6f0 100%);
            color: var(--text);
        }

        .filter-pill:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.2);
        }

        .filter-pill.active {
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
        }

        .filter-pill[data-week="all"].active {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            border-color: #ff1493;
        }

        .filter-pill[data-week="1"].active {
            background: linear-gradient(135deg, #ff6b9d, #ff99d1);
            border-color: #ff6b9d;
        }

        .filter-pill[data-week="2"].active {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            border-color: #ff1493;
        }

        .filter-pill[data-week="3"].active {
            background: linear-gradient(135deg, #ff69b4, #ff99d1);
            border-color: #ff69b4;
        }

        .filter-pill[data-week="4"].active {
            background: linear-gradient(135deg, #ff85c1, #ffb3d9);
            border-color: #ff85c1;
        }

        .filter-pill[data-week="5"].active {
            background: linear-gradient(135deg, #ff99d1, #ffcceb);
            border-color: #ff99d1;
        }

        .filter-pill[data-week="6"].active {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            border-color: #ff1493;
        }

        .filter-pill[data-week="mixed"].active {
            background: linear-gradient(135deg, #ff1493, #ff85c1);
            border-color: #ff1493;
        }

        /* ── Question card ─────────────────────────────── */
        #question-card {
            background: linear-gradient(135deg, #ffcceb 0%, #ffe6f0 100%);
            border: 2px solid #ff99d1;
            border-radius: 16px;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.15);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .q-meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .q-num {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .week-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            box-shadow: 0 0 8px rgba(255, 20, 147, 0.3);
        }

        .topic-badge {
            font-size: 0.72rem;
            color: var(--text);
            background: linear-gradient(135deg, #ffe6f0 0%, #fff0f6 100%);
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            border: 2px solid #ff99d1;
        }

        #question-text {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 1.6rem;
            color: var(--text);
        }

        #question-text code {
            background: linear-gradient(135deg, #ffe6f0 0%, #fff0f6 100%);
            color: #ff1493;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            border: 1px solid #ff99d1;
        }

        /* Code block inside question */
        .code-block {
            background: linear-gradient(135deg, #fff0f6 0%, #ffe6f0 100%);
            border: 2px solid #ff99d1;
            border-radius: 8px;
            padding: 1rem 1.2rem;
            margin: 0.8rem 0 1.2rem;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.88rem;
            color: #ff1493;
            white-space: pre;
            overflow-x: auto;
            line-height: 1.6;
        }

        /* ── Options ─────────────────────────────── */
        #options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.85rem 1.1rem;
            border-radius: 10px;
            border: 2px solid #ff99d1;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe6f0 100%);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .option-item:hover:not(.disabled) {
            border-color: #ff1493;
            background: linear-gradient(135deg, #ffcceb 0%, #fff0f6 100%);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.3);
        }

        .option-item.selected:not(.revealed) {
            border-color: #ff1493;
            background: linear-gradient(135deg, #ffb3d9 0%, #ffe6f0 100%);
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
        }

        .option-item.correct {
            border-color: #ff1493;
            background: linear-gradient(135deg, #ffcceb 0%, #ffe6f0 100%);
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
        }

        .option-item.wrong {
            border-color: #ff6b9d;
            background: linear-gradient(135deg, #ffcceb 0%, #ffe6f0 100%);
            opacity: 0.6;
        }

        .option-item.missed {
            border-color: #ff1493;
            background: linear-gradient(135deg, #ffcceb 0%, #ffe6f0 100%);
            opacity: 0.7;
        }

        .option-letter {
            min-width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb3d9 0%, #ff99d1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
            transition: background 0.15s;
            color: #fff;
            box-shadow: 0 0 8px rgba(255, 20, 147, 0.3);
        }

        .option-item.correct .option-letter {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
        }

        .option-item.wrong .option-letter {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff99d1 100%);
            color: #fff;
        }

        .option-item.missed .option-letter {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
        }

        .option-item.selected:not(.revealed) .option-letter {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
        }

        .option-text {
            font-size: 0.93rem;
            line-height: 1.5;
            flex: 1;
            color: var(--text);
        }

        .option-text code {
            background: linear-gradient(135deg, #ffe6f0 0%, #fff0f6 100%);
            color: #ff1493;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.88em;
            border: 1px solid #ff99d1;
        }

        .option-icon {
            margin-left: auto;
            font-size: 1.1rem;
            flex-shrink: 0;
            align-self: center;
        }

        /* ── Explanation box ─────────────────────────────── */
        #explanation-box {
            display: none;
            margin-top: 1.4rem;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe6f0 100%);
            border: 2px solid #ff99d1;
            border-radius: 10px;
            padding: 1.1rem 1.3rem;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text);
            animation: fadeIn 0.25s ease;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.1);
        }

        #explanation-box.show {
            display: block;
        }

        #explanation-box strong {
            color: var(--text);
        }

        #explanation-box code {
            background: #ffe6f0;
            color: #ff1493;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.88em;
        }

        #explanation-box .exp-title {
            font-weight: 700;
            color: #ff1493;
            margin-bottom: 0.5rem;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── Action buttons ─────────────────────────────── */
        #action-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.6rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #btn-submit {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
            flex: 1;
            min-width: 120px;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            border: 2px solid #ff1493;
        }

        #btn-submit:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.6);
            transform: scale(1.05);
        }

        #btn-next {
            background: linear-gradient(135deg, #ffcceb 0%, #ffe6f0 100%);
            color: var(--text);
            border: 2px solid #ff99d1;
            flex: 1;
            min-width: 120px;
            display: none;
        }

        #btn-next:hover {
            background: linear-gradient(135deg, #ffb3d9 0%, #ffcceb 100%);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.3);
        }

        #btn-prev {
            background: linear-gradient(135deg, #ffcceb 0%, #ffe6f0 100%);
            color: var(--text);
            border: 2px solid #ff99d1;
            min-width: 80px;
        }

        #btn-prev:hover:not(:disabled) {
            color: var(--text);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.3);
        }

        /* ── Results screen ─────────────────────────────── */
        #results-screen {
            display: none;
            background: linear-gradient(135deg, #ffcceb 0%, #ffe6f0 100%);
            border: 2px solid #ff99d1;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            animation: fadeIn 0.4s ease;
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.15);
        }

        #results-screen h2 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .big-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 1rem 0;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
        }

        .score-sub {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        #grade-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .grade-box {
            background: linear-gradient(135deg, #fff0f6 0%, #ffe6f0 100%);
            border: 2px solid #ff99d1;
            border-radius: 10px;
            padding: 1rem;
        }

        .grade-box .gb-num {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff1493;
        }

        .grade-box .gb-lbl {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 0.2rem;
        }

        .grade-box.correct .gb-num {
            color: #ff1493;
        }

        .grade-box.wrong .gb-num {
            color: #ff6b9d;
        }

        .grade-box.skipped .gb-num {
            color: #ff99d1;
        }

        #btn-restart {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            border: 2px solid #ff1493;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
        }

        #btn-restart:hover {
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.6);
            transform: scale(1.05);
        }

        /* ── Answer popup ─────────────────────────────── */
        #answer-popup {
            position: fixed;
            inset: 0;
            background: rgba(255, 20, 147, 0.25);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 30;
        }

        #answer-popup.show {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .answer-popup-card {
            width: min(560px, 94vw);
            border-radius: 18px;
            border: 2px solid #ff99d1;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe6f0 100%);
            box-shadow: 0 15px 45px rgba(255, 20, 147, 0.28);
            padding: 1.25rem 1.2rem 1.1rem;
            animation: popIn 0.22s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .answer-popup-top {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.6rem;
        }

        #answer-popup-emoji {
            font-size: 1.65rem;
            line-height: 1;
        }

        #answer-popup-title {
            font-size: 1.08rem;
            font-weight: 800;
            color: #ff1493;
            letter-spacing: 0.02em;
        }

        #answer-popup-msg {
            font-size: 0.93rem;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 0.9rem;
        }

        #answer-popup-msg code {
            background: #ffe6f0;
            color: #ff1493;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            border: 1px solid #ff99d1;
            font-size: 0.88em;
        }

        #btn-popup-close {
            width: 100%;
            border: 2px solid #ff1493;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
            padding: 0.62rem 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.35);
        }

        #btn-popup-close:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 22px rgba(255, 20, 147, 0.52);
        }

        /* ── Mobile ─────────────────────────────── */
        @media (max-width: 520px) {
            header {
                padding: 0.75rem 1rem;
            }

            .container {
                padding: 1rem 1rem 3rem;
            }

            #question-card {
                padding: 1.3rem;
            }
        }

        /* Plain dark theme override */
        :root {
            --bg: #0f1115;
            --surface: #171b22;
            --card: #1d2430;
            --accent: #4ea1ff;
            --accent2: #7bb9ff;
            --correct: #4ea1ff;
            --wrong: #ff6b6b;
            --neutral: #94a3b8;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --border: #334155;
            --badge-w1: #3b82f6;
            --badge-w2: #3b82f6;
            --badge-w3: #3b82f6;
            --badge-w4: #3b82f6;
            --badge-w5: #3b82f6;
            --badge-w6: #3b82f6;
            --badge-mx: #3b82f6;
        }

        #emoji-sky,
        .flying-emoji,
        .flying-emoji__inner {
            display: none !important;
        }

        body {
            background: #0f1115;
            color: var(--text);
        }

        header,
        #question-card,
        #results-screen,
        .grade-box,
        .answer-popup-card,
        #explanation-box,
        .option-item,
        .topic-badge,
        #btn-next,
        #btn-prev,
        .filter-pill,
        #score-badge,
        #progress-bar-track {
            background: #1a1f29 !important;
            border-color: #334155 !important;
            color: var(--text) !important;
            box-shadow: none !important;
            animation: none !important;
            text-shadow: none !important;
        }

        #progress-bar-fill,
        #btn-submit,
        #btn-restart,
        #btn-popup-close,
        .week-badge,
        .filter-pill.active,
        .option-item.correct .option-letter,
        .option-item.selected:not(.revealed) .option-letter,
        .option-item.missed .option-letter,
        .big-score {
            background: #3b82f6 !important;
            border-color: #3b82f6 !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        .option-letter {

            // Set metadata
            qNumLabel.textContent = `Q${currentIndex + 1}`;
            weekBadge.textContent = q.week === 'mixed' ? 'Mixed' : `Week ${q.week}`;
            weekBadge.style.background = weekColors[q.week] || '#ff1493';
            topicBadge.textContent = q.topic;

            // Store the correct answer's TEXT before shuffling
            currentCorrectAnswerText = q.options[q.correct];

            // Shuffle the options
            const shuffledOptions = shuffleArray(q.options);

            // Set question text
            questionText.innerHTML = q.q;
            if (q.code) {
                const codeBlock = document.createElement('pre');
                codeBlock.className = 'code-block';
                codeBlock.textContent = q.code;
                questionText.appendChild(codeBlock);
            }

            // Render shuffled options
            optionsList.innerHTML = '';
            shuffledOptions.forEach((optText, i) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.dataset.optionText = optText; // Store original text for answer checking
                li.innerHTML = `
          <span class="option-letter">${String.fromCharCode(65 + i)}</span>
          <span class="option-text">${optText}</span>
          <span class="option-icon"></span>
        `;
                li.addEventListener('click', () => selectOption(li));
                optionsList.appendChild(li);
            });

            // Reset UI
            optionsList.querySelectorAll('.option-item').forEach(el => {
                el.classList.remove('selected', 'disabled', 'correct', 'wrong', 'missed');
            });
            explanationBox.classList.remove('show');
            btnSubmit.style.display = 'inline-block';
            btnNext.style.display = 'none';

            // If already answered, show previous answer
            if (revealed[currentIndex]) {
                showPreviousAnswer();
            }
        }

        function selectOption(li) {
            const optionsList = document.getElementById('options-list');
            if (revealed[currentIndex]) return; // Already answered
            optionsList.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            li.classList.add('selected');
        }

        function revealAnswer() {
            if (revealed[currentIndex]) return;

            const optionsList = document.getElementById('options-list');
            const selectedLi = optionsList.querySelector('.option-item.selected');
            if (!selectedLi) return;

            const selectedText = selectedLi.dataset.optionText;
            const isCorrect = selectedText === currentCorrectAnswerText;

            // Store the answer (we'll store the text, but convert for scoring)
            answers[currentIndex] = selectedText;
            revealed[currentIndex] = true;

            // Disable all options
            optionsList.querySelectorAll('.option-item').forEach(li => li.classList.add('disabled'));

            // Show result
            if (isCorrect) {
                selectedLi.classList.add('correct');
                selectedLi.querySelector('.option-icon').innerHTML = '✔️';
                playCorrectAnswerSound();
                showAnswerPopup(true, filteredQ[currentIndex].explanation);
            } else {
                selectedLi.classList.add('wrong');
                selectedLi.querySelector('.option-icon').innerHTML = '❌';
                // Highlight correct answer
                const correctLi = Array.from(optionsList.children).find(li => li.dataset.optionText === currentCorrectAnswerText);
                if (correctLi) {
                    correctLi.classList.add('missed');
                    correctLi.querySelector('.option-icon').innerHTML = '✓';
                }
                showAnswerPopup(false, filteredQ[currentIndex].explanation);
            }

            updateScore();
            updateProgress();

            const explanationBox = document.getElementById('explanation-box');
            const btnSubmit = document.getElementById('btn-submit');
            const btnNext = document.getElementById('btn-next');

            explanationBox.classList.add('show');
            btnSubmit.style.display = 'none';
            btnNext.style.display = 'inline-block';
        }

        function showPreviousAnswer() {
            const optionsList = document.getElementById('options-list');
            const selectedText = answers[currentIndex];
            const q = filteredQ[currentIndex];

            optionsList.querySelectorAll('.option-item').forEach(li => {
                li.classList.add('disabled');
                if (li.dataset.optionText === selectedText) {
                    li.classList.add(selectedText === currentCorrectAnswerText ? 'correct' : 'wrong');
                    li.querySelector('.option-icon').innerHTML = selectedText === currentCorrectAnswerText ? '✔️' : '❌';
                } else if (li.dataset.optionText === currentCorrectAnswerText) {
                    li.classList.add('missed');
                    li.querySelector('.option-icon').innerHTML = '✓';
                }
            });

            const explanationBox = document.getElementById('explanation-box');
            const btnSubmit = document.getElementById('btn-submit');
            const btnNext = document.getElementById('btn-next');

            explanationBox.classList.add('show');
            btnSubmit.style.display = 'none';
            btnNext.style.display = 'inline-block';
        }

        document.getElementById('btn-submit').addEventListener('click', revealAnswer);

        // ─────────────────────────────────────────────────────────────────────────────
        // FILTERING
        // ─────────────────────────────────────────────────────────────────────────────
        function filterQuestions(week) {
            if (week === 'all') {
                filteredQ = QUESTIONS;
            } else {
                filteredQ = QUESTIONS.filter(q => {
                    if (week === 'mixed') return q.week === 'mixed';
                    return q.week === parseInt(week);
                });
            }
            currentIndex = 0;
            answers = {};
            revealed = {};
            renderQuestion();
            updateProgress();
            updateScore();
        }

        // Filter pill click handlers
        document.querySelectorAll('.filter-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                const week = pill.dataset.week;
                filterQuestions(week);
            });
        });

        // Safe audio setup (keeps quiz working even if audio file/codec is unavailable)
        let correctAnswerSound = null;
        try {
            correctAnswerSound = new Audio('./specialsound.m4a');
            correctAnswerSound.preload = 'auto';
        } catch (_) {
            correctAnswerSound = null;
        }

        // Initialize with all questions
        filterQuestions('all');

        function playCorrectAnswerSound() {
            if (!correctAnswerSound) return;
            try {
                // Clone for each play to avoid currentTime/readyState issues across browsers.
                const oneShot = correctAnswerSound.cloneNode();
                oneShot.volume = 1;
                const playPromise = oneShot.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => { });
                }
            } catch (_) {
                // Ignore audio playback failures (autoplay policies, missing codec, etc.)
            }
        }

        function goToNextQuestion() {
            currentIndex++;
            if (currentIndex < filteredQ.length) {
                renderQuestion();
                updateProgress();
            } else {
                document.getElementById('question-card').style.display = 'none';
                document.getElementById('results-screen').style.display = 'block';
                showResults();
            }
        }

        function showAnswerPopup(isCorrect, explanationHtml) {
            const popup = document.getElementById('answer-popup');
            const emoji = document.getElementById('answer-popup-emoji');
            const title = document.getElementById('answer-popup-title');
            const msg = document.getElementById('answer-popup-msg');

            emoji.textContent = isCorrect ? '🥰' : '😝';
            title.textContent = isCorrect ? 'Correct!' : 'Almost there!!';
            msg.innerHTML = explanationHtml || '';

            popup.classList.add('show');
            popup.setAttribute('aria-hidden', 'false');
        }

        function closeAnswerPopupAndContinue() {
            const popup = document.getElementById('answer-popup');
            popup.classList.remove('show');
            popup.setAttribute('aria-hidden', 'true');
            goToNextQuestion();
        }

        document.getElementById('btn-popup-close').addEventListener('click', closeAnswerPopupAndContinue);

        document.getElementById('btn-next').addEventListener('click', goToNextQuestion);

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                updateProgress();
            }
        });

        // ─────────────────────────────────────────────────────────────────────────────
        // PROGRESS & SCORE
        // ─────────────────────────────────────────────────────────────────────────────
        function updateProgress() {
            const total = filteredQ.length;
            const done = Object.keys(revealed).length;
            const pct = total === 0 ? 0 : Math.round((currentIndex + 1) / total * 100);
            document.getElementById('prog-text').textContent = `Question ${Math.min(currentIndex + 1, total)} of ${total}`;
            document.getElementById('prog-pct').textContent = `${pct}%`;
            document.getElementById('progress-bar-fill').style.width = `${Math.max(1, pct)}%`;
        }

        function updateScore() {
            let correct = 0;
            for (const [idx, chosen] of Object.entries(answers)) {
                if (filteredQ[idx] && filteredQ[idx].correct === chosen) correct++;
            }
            document.getElementById('live-score').textContent = correct;
            document.getElementById('live-total').textContent = filteredQ.length;
        }

        function getHighScoreMessage(scorePercent) {
            if (scorePercent > 85) {
                return 'Aww, that was super cute work. You did an amazing job!';
            }
            return '';
        }

        function showResults() {
            const total = filteredQ.length;
            let correct = 0, wrong = 0;
            for (const [idx, chosen] of Object.entries(answers)) {
                if (!filteredQ[idx]) continue;
                if (filteredQ[idx].correct === chosen) correct++;
                else wrong++;
            }
            const skipped = total - Object.keys(answers).length;
            const pct = total === 0 ? 0 : Math.round(correct / total * 100);
            const highScoreMessage = getHighScoreMessage(pct);
            document.getElementById('final-score-txt').textContent = `${pct}%`;
            document.getElementById('final-score-sub').textContent = highScoreMessage || `You got ${correct} out of ${total} correct.`;
            document.getElementById('res-correct').textContent = correct;
            document.getElementById('res-wrong').textContent = wrong;
            document.getElementById('res-skipped').textContent = skipped;
        }

        function restart() {
            currentIndex = 0;
            answers = {};
            revealed = {};
            document.getElementById('question-card').style.display = 'block';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('answer-popup').classList.remove('show');
            document.getElementById('answer-popup').setAttribute('aria-hidden', 'true');
            renderQuestion();
            updateProgress();
            updateScore();
        }

        // ─────────────────────────────────────────────────────────────────────────────
        // INIT
        // ─────────────────────────────────────────────────────────────────────────────
        renderQuestion();
        updateProgress();
        updateScore();
    </script>
</body>

</html>
